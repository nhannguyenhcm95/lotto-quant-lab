<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không Tìm Thấy Trang | LOTTO-QUANT LAB</title>
  <meta name="robots" content="noindex, follow">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(217, 119, 6, 0.35);
      --accent-amber: #f59e0b;
      --accent-gold: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(217, 119, 6, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .error-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(217, 119, 6, 0.15);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-404 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(217, 119, 6, 0.4);
      border-radius: 9999px;
      color: var(--accent-amber);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .code-404 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 6px 20px rgba(217, 119, 6, 0.5);
      transform: translateY(-2px);
    }

    .footer-note {
      margin-top: 32px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="badge-404">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>Lỗi Định Tuyến Không Gian</span>
    </div>
    <div class="code-404">404</div>
    <h1>Trang Yêu Cầu Không Tồn Tại</h1>
    <p>Đường dẫn bạn vừa truy cập không nằm trong không gian dữ liệu của LOTTO-QUANT LAB hoặc đã được tái cấu trúc định lượng.</p>
    
    <a href="/" class="btn-home">
      <i class="fa-solid fa-house"></i>
      <span>Quay Về Trang Nghiên Cứu Chính</span>
    </a>

    <div class="footer-note">
      LOTTO-QUANT LAB • Hệ Thống Phân Tích Xác Suất Chuẩn Mực
    </div>
  </div>
</body>
</html>
